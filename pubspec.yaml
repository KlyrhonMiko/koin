name: koin
description: "A new Flutter project."
publish_to: 'none'
version: 1.1.3+5

environment:
  sdk: ^3.11.3

dependencies:
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_riverpod: ^3.4.3
  font_awesome_flutter: ^11.0.0
  gap: ^3.0.1
  google_fonts: ^8.2.1
  intl: ^0.20.3
  path: ^1.9.1
  path_provider: ^2.1.6
  sqflite: ^2.4.4+1
  uuid: ^4.6.0
  shared_preferences: ^2.5.6
  share_plus: ^13.3.1
  file_picker: ^13.1.0
  lottie: ^3.6.1
  flutter_staggered_animations: ^1.1.1
  pdf: ^3.13.1
  csv: ^8.0.0
  speech_to_text: ^7.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  sqflite_common_ffi: ^2.4.3

flutter:
  uses-material-design: true
  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/outfit/Outfit-Regular.ttf
          weight: 400
        - asset: assets/fonts/outfit/Outfit-Medium.ttf
          weight: 500
        - asset: assets/fonts/outfit/Outfit-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/outfit/Outfit-Bold.ttf
          weight: 700
        - asset: assets/fonts/outfit/Outfit-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/outfit/Outfit-Black.ttf
          weight: 900
  assets:
    - assets/logos/
    - assets/logo.png
